version: v1.0
name: "\U0001F439 Go CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'golang:1.23'
fail_fast:
  stop:
    when: branch = 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - 'export PATH=$PATH:/usr/local/go/bin:/go/bin'
      - 'export PATH=$PATH:/usr/local/go/bin:$(go env GOPATH)/bin'
      - cache restore
blocks:
  - name: "\U0001F6E0 Setup and Cache"
    dependencies: []
    task:
      jobs:
        - name: Install Dependencies
          commands:
            - go get
            - go build -o ./bin/main
            - psql -p 5432 -h localhost -U postgres -c "CREATE DATABASE s2"
            - go install gotest.tools/gotestsum@latest
            - gotestsum --junitfile junit.xml ./...
after_pipeline:
  task:
    jobs:
      - name: "Merge Reports \U0001F4CA"
        commands:
          - test-results gen-pipeline-report
