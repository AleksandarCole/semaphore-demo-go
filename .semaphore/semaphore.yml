version: v1.0
name: "\U0001F439 Go CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'golang:1.19'
    - name: postgres
      image: 'postgres:17'
      env_vars:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: myapp_test
blocks:
  - name: Build project
    task:
      jobs:
        - name: go get & build
          commands:
            - checkout
            - which go
            - go version
            - go get
            - go build -o ./bin/main
            - cache store $(checksum main.go) bin
  - name: Check code style
    task:
      jobs:
        - name: gofmt
          commands:
            - checkout
            - gofmt main.go | diff --ignore-tab-expansion main.go -
  - name: Run tests
    task:
      prologue:
        commands:
          - checkout
      jobs:
        - name: go test
          commands:
            - psql -p 5432 -h localhost -U postgres -c "CREATE DATABASE s2"
            - go install gotest.tools/gotestsum@latest
            - gotestsum --junitfile junit.xml ./...
        - name: Test web server
          commands:
            - cache restore $(checksum main.go)
            - ./bin/main 8001 &
            - 'curl --silent localhost:8001/time | grep "The current time is"'
      epilogue:
        always:
          commands:
            - test-results publish junit.xml
after_pipeline:
  task:
    jobs:
      - name: Publish Results
        commands:
          - test-results gen-pipeline-report
